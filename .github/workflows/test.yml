name: Test coverage
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Test coverage
    services:
      db:
        image: postgres:latest
        env:
          POSTGRES_PASSWORD: demo
          POSTGRES_USER: demo
          POSTGRES_DB: demo
        ports:
          - 5962:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Install dotnet-coverage
        run: dotnet tool install --global dotnet-coverage

      - name: Init database
        run: |
          for f in tests/output/pg/src/*.sql; do
            PGPASSWORD=demo psql -h localhost -p 5962 -U demo -d demo -f "$f"
          done

      - name: run tests - tmdgen
        run: dotnet-coverage collect --settings coverage.settings.xml --output "./tmdgen-database-coverage-results.xml" --output-format cobertura -- "dotnet run --project TopModel.ModelGenerator/TopModel.ModelGenerator.csproj -- -f tests/tmdgen/database/tmdgen.config -f tests/tmdgen/open-api/tmdgen.config -c"

      - name: run tests - modgen
        run: dotnet-coverage collect --settings coverage.settings.xml --output "./modgen-coverage-results.xml" --output-format cobertura -- "dotnet run --project ./TopModel.Generator -s -u all -c Release"

      - name: build tests - language server
        run: dotnet build TopModel.LanguageServer.Tests -c Release

      - name: run tests - language server
        run: dotnet-coverage collect --settings coverage.settings.xml --output "./ls-tests-coverage-results.xml" --output-format cobertura -- "dotnet test TopModel.LanguageServer.Tests -c Release --no-build"

      - name: build tests - language server integration
        run: dotnet build TopModel.LanguageServer.IntegrationTests -c Release

      # Le language server est lancé par les tests en processus enfant : dotnet-coverage le couvre aussi.
      - name: run tests - language server integration
        run: dotnet-coverage collect --settings coverage.settings.xml --output "./ls-integration-coverage-results.xml" --output-format cobertura -- "dotnet test TopModel.LanguageServer.IntegrationTests -c Release --no-build"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./modgen-coverage-results.xml,./tmdgen-database-coverage-results.xml,./ls-tests-coverage-results.xml,./ls-integration-coverage-results.xml
